es:{kicker:"Minis de Navidad 2026",intro:"Un piano, una sala llena de música y una pizca de magia. Esta Navidad invitamos a vuestros peques a entrar en una habitación encantada donde cada nota despierta un sueño. Ellos juegan, descubren y brillan; nosotros guardamos ese momento para siempre.",cta:"Reservar sesión",packk:"NUESTRO PACK",

, falda o camisa) combinado con crema o camel; todo de verde se funde con la pared. Y evitad el negro puro (se funde con el piano).","Nada de colores fríos o neón, logotipos, personajes ni estampados grandes.","Calzado sencillo, una muda de recambio y, si queréis, el peluche favorito."]}};
let L=localStorage.lang||'gl',DATA={},view=new Date(2026,9,1),selDay=null,selTime=null;
const $=s=>document.querySelector(s);
function tr(){document.documentElement.lang=L;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[L][e.dataset.t]);document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=T[L][e.dataset.tp]);$('#wearlist').innerHTML=T[L].wear.map(x=>`<li>${x}</li>`).join('');const sw=(c,x)=>`<div class="sans" style="text-align:center;font-size:12px;max-width:110px;${x?'opacity:.75':''}"><div style="width:64px;height:64px;border-radius:50%;background:${c.hex};border:1px solid #ddd;margin:auto 0 6px;margin-left:auto;margin-right:auto;position:relative">${x?'<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px">×</span>':''}</div>${c[L]}</div>`;$('#pal').innerHTML=(window.PALETTE||[]).map(c=>sw(c)).join('');$('#avoid').innerHTML=(window.AVOID||[]).map(c=>sw(c,1)).join('');$('#packlist').innerHTML=T[L].list.map(x=>`<li>${x}</li>`).join('');document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l==L));render();if(selTime)chosen();}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=localStorage.lang=b.dataset.l;tr()});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const WDN={gl:['domingo','luns','martes','mércores','xoves','venres','sábado'],es:['domingo','lunes','martes','miércoles','jueves','viernes','sábado']};
function fmt(ds){const d=new Date(ds+'T12:00'),w=WDN[L][d.getDay()],m=T[L].months[d.getMonth()].toLowerCase();return w.charAt(0).toUpperCase()+w.slice(1)+', '+d.getDate()+' de '+m}
function render(){const y=view.getFullYear(),m=view.getMonth();$('#mlabel').textContent=T[L].months[m]+' '+y;let h=T[L].days.map(d=>`<div class="h">${d}</div>`).join('');
 const off=(new Date(y,m,1).getDay()+6)%7;for(let i=0;i<off;i++)h+='<div></div>';const n=new Date(y,m+1,0).getDate();
 for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d)),s=DATA[k];if(!s){h+=`<button class="day" disabled>${d}</button>`;continue}const f=s.filter(x=>x.available).length;
 h+=`<button class="day ${f?'':'full'} ${k==selDay?'sel':''}" data-d="${k}" ${f?'':'disabled'}>${d}<small>${f?f+' '+T[L].free:T[L].full}</small></button>`}
 $('#cal').innerHTML=h;$('#cal').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{selDay=b.dataset.d;selTime=null;render();$('#formsec').classList.add('hidden')});
 $('#prev').disabled=y==2026&&m<=9;$('#next').disabled=y==2027&&m>=0;
 const sl=selDay?DATA[selDay]:null;$('#slots').innerHTML=sl?sl.map(x=>`<button class="slot ${x.time==selTime?'sel':''}" data-t2="${x.time}" ${x.available?'':'disabled'}>${x.time}</button>`).join(''):'';
 $('#slots').querySelectorAll('[data-t2]').forEach(b=>b.onclick=()=>{selTime=b.dataset.t2;render();chosen();$('#formsec').classList.remove('hidden');$('#formsec').scrollIntoView({behavior:'smooth'})});}
function chosen(){$('#chosen').textContent=fmt(selDay)+' · '+selTime+' h · Nadal Musical · 110 €'}
$('#prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('#next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};
$('#f').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));Object.assign(b,{action:'book',date:selDay,time:selTime,lang:L});
 const r=await API.post(b);if(!r.ok){$('#err').textContent=r.error=='taken'?T[L].taken:r.error;await load();return}
 $('#formsec').classList.add('hidden');$('#reservar').classList.add('hidden');$('#done').classList.remove('hidden');$('#summary').textContent=fmt(selDay)+' · '+selTime+' h · '+b.name;$('#done').classList.remove('hidden');$('#done').scrollIntoView();};
async function load(){DATA=(await API.get({action:'slots'})).days;render()}
const sw2=$('#samewa'),ph=$('[name=phone]'),wa=$('[name=whatsapp]');sw2.onchange=()=>{wa.readOnly=sw2.checked;if(sw2.checked)wa.value=ph.value};ph.oninput=()=>{if(sw2.checked)wa.value=ph.value};
tr();load();
